<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - The Game Website</title>
    <meta name="description" content="Login to your gaming account to access your games, deals, and tournaments.">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <!-- Floating Particles -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- Back to Home -->
    <a href="index.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <div class="form-container">
        <!-- Logo -->
        <div class="auth-logo">
            <i class="fas fa-gamepad"></i>
            <span>GAME ZONE</span>
        </div>

        <h2>Welcome Back</h2>
        <p class="form-subtitle">Login to continue your adventure</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                    <i class="fas fa-user"></i>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <i class="fas fa-lock"></i>
                </div>
            </div>
            <button type="submit" class="auth-btn">Login</button>
        </form>

        <div class="divider">or</div>

        <p class="auth-footer">Don't have an account? <a href="signup.html">Sign up here</a></p>
    </div>

    <script src="script.js"></script>
</body>

</html>
